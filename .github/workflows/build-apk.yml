name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "Checking Java installation..."
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected version line: ${JAVA_VERSION_OUTPUT}"

          JAVA_MAJOR=$(echo "${JAVA_VERSION_OUTPUT}" | sed -E 's/.*"([0-9]+)(\.[0-9]+.*)?".*/\1/')
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to detect active Java major version from output: ${JAVA_VERSION_OUTPUT}"
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Active Java major version (${JAVA_MAJOR}) is lower than required version 17."
            exit 1
          fi

          echo "Java environment verified successfully (Java ${JAVA_MAJOR})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYSTORE_FILE="./debug.keystore"

          if [ -f "${KEYSTORE_FILE}" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_FILE}."
          else
            echo "Generating temporary debug keystore at ${KEYSTORE_FILE}..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "${KEYSTORE_FILE}" ] || [ ! -s "${KEYSTORE_FILE}" ]; then
            echo "::error::Failed to create or verify temporary debug keystore at ${KEYSTORE_FILE}."
            exit 1
          fi

          echo "Temporary debug keystore verified at ${KEYSTORE_FILE}."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "${EXPECTED_APK}" ]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk for discovered APK files:"
              find "app/build/outputs/apk" -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "::error::${EXPECTED_APK} does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path (${EXPECTED_APK}) does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}")
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${SOURCE_APK}" ] || [ ! -s "${SOURCE_APK}" ]; then
            echo "::error::Verified APK is missing or empty prior to release asset preparation."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          if [ -z "${SANITIZED_REPO_NAME}" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TEMP_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset-XXXXXX")
          ASSET_PATH="${RELEASE_TEMP_DIR}/${ASSET_FILENAME}"

          cp -- "${SOURCE_APK}" "${ASSET_PATH}"

          if [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Failed to copy release APK asset to ${ASSET_PATH}."
            exit 1
          fi

          echo "Prepared release asset: ${ASSET_PATH}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"
          echo "asset_name=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          echo "Verifying GitHub CLI availability..."
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Prepared release asset (${ASSET_PATH:-unset}) is missing or empty."
            exit 1
          fi

          case "${ASSET_PATH}" in
            *.apk) ;;
            *)
              echo "::error::Prepared release asset (${ASSET_PATH}) is not a .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")
          cat <<EOF > "${NOTES_FILE}"
          ### Automated Debug APK Release

          - **Build Type:** Automatically generated debug APK
          - **Built By:** GitHub Actions
          - **Workflow Run Number:** \`${GITHUB_RUN_NUMBER}\`
          - **Workflow Run Attempt:** \`${GITHUB_RUN_ATTEMPT}\`
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **Release Asset:** \`${ASSET_NAME}\`

          #### Important Notices
          - This APK is intended strictly for **testing and evaluation**.
          - This is **not** a Google Play Store production release.
          - This APK is signed only with a **temporary debug keystore** generated during the workflow run.
          EOF

          echo "Creating GitHub Release ${RELEASE_TAG}..."
          gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes-file "${NOTES_FILE}" \
            --target "${GITHUB_SHA}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -u
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "${PUBLISH_OUTCOME}" = "success" ] && gh release view "${RELEASE_TAG}" --json url,tagName,name >/dev/null 2>&1; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url --jq '.url')
            echo "=========================================="
            echo "GitHub Release published successfully!"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"
            echo "Backup Artifact Name: app-debug-apk"
            echo "=========================================="

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Status:** Debug APK built and published to GitHub Releases."
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Page URL:** [${RELEASE_URL}](${RELEASE_URL})"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo ""
              echo "You can download \`${ASSET_NAME}\` directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available on this workflow run summary page as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing did not succeed, but the debug APK build and Actions artifact upload succeeded."
            echo "The debug APK remains available for download from the GitHub Actions artifact named: app-debug-apk"

            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "> [!WARNING]"
              echo "> GitHub Release publishing failed or was skipped, but **the debug APK build and GitHub Actions artifact upload succeeded**."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Actions Artifact Name:** \`app-debug-apk\`"
              echo ""
              echo "### How to Download the APK"
              echo "Open the summary page of this workflow run in GitHub Actions and download the **\`app-debug-apk\`** artifact from the **Artifacts** section."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
